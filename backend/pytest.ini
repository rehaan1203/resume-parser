[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# AsyncIO configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Default flags: verbose output, skip live external network/API tests
addopts = -v -m "not live" --tb=short

# Registered custom markers
markers =
    live: marks tests as requiring external network, API keys, or live services
    slow: marks tests that take longer to run (e.g. extensive matrix or RAG sweeps)
    asyncio: marks an async test function

# Filter known third-party deprecations to keep test output clean
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
